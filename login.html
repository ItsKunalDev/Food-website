<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Spice Routes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="image/favicon.svg">
</head>

<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <a href="index.html" class="back-link">&larr; Back to Home</a>
                <h2>Welcome Back</h2>
                <p>Sign in to satisfy your cravings</p>
            </div>

            <div class="auth-toggle">
                <button class="toggle-btn active" id="show-login">Login</button>
                <button class="toggle-btn" id="show-signup">Sign Up</button>
            </div>

            <div id="error-message" class="error-msg hidden"></div>
            <div id="success-message" class="success-msg hidden"></div>

            <div class="social-auth">
                <button class="btn btn-outline btn-full" id="google-auth-btn"
                    style="margin-bottom: 1rem; color: #DB4437; border-color: #DB4437; background: white;">
                    <i class="fa-brands fa-google"></i> Continue with Google
                </button>
                <div class="divider"><span>OR</span></div>
            </div>

            <form id="login-form" class="auth-form active-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="login-submit">
                    <span class="btn-text">Login</span>
                    <span class="loader hidden"></span>
                </button>
            </form>

            <form id="signup-form" class="auth-form hidden-form">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" required placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" required placeholder="Create a password">
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="signup-submit">
                    <span class="btn-text">Sign Up</span>
                    <span class="loader hidden"></span>
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('show-login').addEventListener('click', () => {
            document.getElementById('show-login').classList.add('active');
            document.getElementById('show-signup').classList.remove('active');
            document.getElementById('login-form').classList.remove('hidden-form');
            document.getElementById('signup-form').classList.add('hidden-form');
            document.querySelector('.auth-header h2').innerText = 'Welcome Back';
            document.querySelector('.auth-header p').innerText = 'Sign in to satisfy your cravings';
        });

        document.getElementById('show-signup').addEventListener('click', () => {
            document.getElementById('show-signup').classList.add('active');
            document.getElementById('show-login').classList.remove('active');
            document.getElementById('signup-form').classList.remove('hidden-form');
            document.getElementById('login-form').classList.add('hidden-form');
            document.querySelector('.auth-header h2').innerText = 'Create Account';
            document.querySelector('.auth-header p').innerText = 'Join us and start ordering';
        });
    </script>

    <script type="module" src="firebase.js"></script>
</body>

</html>
